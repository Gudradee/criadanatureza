{# Parcial reutilizável: form de filtro por mês/ano + botão Excel.
   Recebe: action (url do form), mes, ano, mes_str, meses_pt,
           export_url (opcional), extras (opcional, dict de hidden inputs). #}
<form method="GET" action="{{ action }}" style="display:flex;gap:var(--sp-2);align-items:center">
  {% for k, v in (extras or {}).items() %}
  <input type="hidden" name="{{ k }}" value="{{ v }}">
  {% endfor %}
  <select name="mes_num" class="form-select" style="width:130px;height:36px">
    {% for n in range(1, 13) %}
    <option value="{{ n }}" {% if n == mes %}selected{% endif %}>{{ meses_pt[n-1] }}</option>
    {% endfor %}
  </select>
  <select name="mes_ano" class="form-select" style="width:85px;height:36px">
    {% for y in range(2023, ano + 3) %}
    <option value="{{ y }}" {% if y == ano %}selected{% endif %}>{{ y }}</option>
    {% endfor %}
  </select>
  <button type="submit" class="btn btn-secondary btn-sm" style="height:36px">Filtrar</button>
  {% if export_url %}
  <a href="{{ export_url }}" class="btn btn-secondary btn-sm"
     style="height:36px;display:inline-flex;align-items:center;gap:6px"
     title="Exportar para Excel">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="7 10 12 15 17 10"/>
      <line x1="12" y1="15" x2="12" y2="3"/>
    </svg>
    Excel
  </a>
  {% endif %}
</form>

<script>

document.currentScript.previousElementSibling.addEventListener('submit', function(e){
  var n = this.querySelector('[name=mes_num]').value;
  var a = this.querySelector('[name=mes_ano]').value;

});
</script>
